# Eingabe-Excel (Kommandozeile: erstes Argument)
excel.input=

# Ausgabe-Excel. Leer = <Eingabename>_converted.xlsx
excel.output=

# Optional: Blattname. Leer = erstes Blatt
excel.sheet=

excel.column.richtung=Richtung BKM
excel.column.lat=Lat:
excel.column.lon=Lon:
excel.column.bkm=BKM:
# Pflicht fuer KilometerReference.roadNumber (z.B. A3)
excel.column.road=BAB
excel.column.block=Block:

# Keycloak Client Credentials Grant
keycloak.token-url=https://auth.example.de/realms/e21x/protocol/openid-connect/token
keycloak.client-id=
keycloak.client-secret=
keycloak.scope=

# GeoService convertLocations: POST /locations
geo.base-url=https://geo-service.apps.external.ipf-prod.e21x.de
geo.convert-path=/locations
geo.target-type=de.e21x.data.location.GeographicalReference
geo.location-type=de.e21x.data.location.KilometerReference$Bean
geo.epsg=GeoJSON
